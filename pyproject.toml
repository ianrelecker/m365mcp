[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "claude-m365-mcp"
version = "26.04"
description = "Local MCP server for one Microsoft 365 user with delegated Microsoft Graph access."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.0",
  "httpx>=0.27.0",
  "mcp[cli]>=1.28.1,<2",  # 2.x is a different HTTP stack; stay on 1.x until we port.
  "pillow>=12.3.0",
  "pypdf>=6.16.1",
  "pypdfium2>=5.12.1",
  "python-dotenv>=1.0.1",
  "starlette>=1.3.1",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
m365-mcp = "m365_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
